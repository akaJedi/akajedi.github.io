name: Contact Form Health Check

on:
  schedule:
    # Daily around 04:00 America/Los_Angeles. GitHub cron uses UTC; this is 04:00 PDT and 03:00 PST.
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contact-form-healthcheck
  cancel-in-progress: false

jobs:
  contact-form:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      CONTACT_WORKER_URL: https://green-rice-1ea7.denis-f21.workers.dev
      CONTACT_ORIGIN: https://www.f12.biz

    steps:
      - name: Send test contact message
        shell: bash
        run: |
          set -euo pipefail

          response_file="$(mktemp)"
          payload='{"name":"GitHub Actions Health Check","email":"healthcheck@example.com","phone":"","message":"Automated daily contact form health check."}'

          status_code="$(curl --silent --show-error --location \
            --output "$response_file" \
            --write-out "%{http_code}" \
            --request POST "$CONTACT_WORKER_URL" \
            --header "Origin: $CONTACT_ORIGIN" \
            --header "Content-Type: application/json" \
            --data "$payload")"

          echo "HTTP status: $status_code"
          cat "$response_file"

          python3 - "$status_code" "$response_file" <<'PY_CHECK'
          import json
          import sys

          status_code = int(sys.argv[1])
          response_file = sys.argv[2]

          with open(response_file, "r", encoding="utf-8") as fh:
              body = fh.read()

          try:
              payload = json.loads(body)
          except json.JSONDecodeError as exc:
              raise SystemExit(f"Response was not valid JSON: {exc}")

          if status_code != 200 or payload.get("success") is not True:
              raise SystemExit(f"Contact form health check failed: HTTP {status_code}, body={payload}")
          PY_CHECK
