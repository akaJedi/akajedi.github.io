{{ $url := .Get "url" }}
{{ $icon := .Get "icon" }}
{{ $label := .Get "label" | default $icon }}
<a
  href="{{ $url | absURL }}"
  target="_blank"
  rel="noopener noreferrer"
  {{ if $icon }}aria-label="{{ $label }}" title="{{ $label }}"{{ end }}
  >{{ if $icon }}<i class="icon-{{ $icon }}"></i>{{ end }}
</a>
