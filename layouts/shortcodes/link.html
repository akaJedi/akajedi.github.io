{{ $url := .Get "url" }}
{{ $icon := .Get "icon" }}
{{ $label := .Get "label" | default $icon }}
<a
  href="{{ $url | absURL }}"
  target="_blank"
  rel="noopener noreferrer"
  {{ if $icon }}title="{{ $label }}"{{ end }}
  >{{ if $icon }}<i class="icon-{{ $icon }}" aria-hidden="true"></i><span class="visually-hidden">{{ $label }}</span>{{ end }}
</a>
