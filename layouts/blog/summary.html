<article class="blog-card">
  <a class="blog-card__main" href="{{ .RelPermalink }}">
    <span class="blog-card__date">{{ .Date.Format "2006-01-02" }}</span>
    <h3>{{ .Title }}</h3>
    <p>{{ .Summary | plainify | truncate 180 }}</p>
  </a>
  <footer class="blog-card__meta">
    <span>{{ .WordCount }} words</span>
    <span>{{ div (add .WordCount 199) 200 }} min read</span>
    {{ with .GetTerms "tags" }}
      <span class="blog-card__tags">
        {{ range first 2 . }}<a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>{{ end }}
      </span>
    {{ end }}
  </footer>
</article>
