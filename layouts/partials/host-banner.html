<script>
  document.addEventListener("DOMContentLoaded", function () {
    const hostname = window.location.hostname;
    const isRussian = document.documentElement.lang.toLowerCase().startsWith("ru");
    let message = "";
    let canonicalLink = false;

    if (hostname === "localhost" || hostname === "127.0.0.1") {
      message = isRussian
        ? "💻 Локальная версия для разработки"
        : "💻 Running on localhost (development mode)";
    } else if (hostname === "cloudflare.f12.biz") {
      message = isRussian
        ? "☁️ Это копия сайта, развёрнутая в Cloudflare Workers. Основная версия на GitHub Pages:"
        : "☁️ This is a copy deployed to Cloudflare Workers. Main version on GitHub Pages:";
      canonicalLink = true;
    } else if (hostname === "www.f12.biz" || hostname === "f12.biz") {
      message = isRussian
        ? "🚀 Основная версия размещена на GitHub Pages"
        : "🚀 Main version hosted on GitHub Pages";
    } else if (hostname === "f12-biz.netlify.app") {
      message = "☁️ Hosted via Netlify";
    } else if (hostname === "f12-biz.pages.dev") {
      message = "🌀 Hosted via Cloudflare Pages";
    }

    if (!message) return;

    const hostBanner = document.createElement("aside");
    hostBanner.className = "host-environment-banner";
    hostBanner.setAttribute("aria-label", isRussian ? "Среда размещения сайта" : "Website hosting environment");

    const text = document.createElement("span");
    text.textContent = message;
    hostBanner.appendChild(text);

    if (canonicalLink) {
      const link = document.createElement("a");
      link.href = "https://www.f12.biz/";
      link.textContent = "www.f12.biz";
      link.rel = "canonical";
      hostBanner.appendChild(link);
    }

    document.body.appendChild(hostBanner);
    document.body.classList.add("has-host-environment-banner");

    const updateBannerHeight = () => {
      document.documentElement.style.setProperty(
        "--host-environment-banner-height",
        `${hostBanner.offsetHeight}px`
      );
    };

    updateBannerHeight();
    if ("ResizeObserver" in window) {
      new ResizeObserver(updateBannerHeight).observe(hostBanner);
    } else {
      window.addEventListener("resize", updateBannerHeight);
    }
  });
</script>
