{{ define "main" }}
<section class="site-skills-section">
    <div class="container">
        <div class="row">
            <div class="col-12 text-center">
                <h1 class="site-skills-title">{{ .Title }}</h1>
                <div class="site-skills-description">
                    {{ .Content }}
                </div>
            </div>
        </div>

        {{ range .Params.skill_categories }}
        <div class="row mt-5">
            <div class="col-12">
                <h2 class="mb-4">{{ .name }}</h2>
                <div class="row">
                    {{ range .skills }}
                    <div class="col-md-6">
                        <div class="skill-item">
                            <div class="skill-header">
                                <h3 class="skill-name">{{ .name }}</h3>
                                <span class="skill-range" aria-label="{{ .level }} out of 100">{{ .level }} / 100</span>
                            </div>
                            <div class="skill-meter" role="progressbar" aria-label="{{ .name }} proficiency" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{ .level }}">
                                <div class="skill-meter__fill" style="width: {{ .level }}%;"></div>
                            </div>
                            <div class="skill-item__footer">
                                <span class="skill-years" aria-label="{{ .years }} years of experience">
                                    <strong>{{ .years }}</strong>
                                    <span>years</span>
                                </span>
                                <span class="skill-description">{{ .description }}</span>
                            </div>
                        </div>
                    </div>
                    {{ end }}
                </div>
            </div>
        </div>
        {{ end }}
    </div>
</section>
{{ end }}
