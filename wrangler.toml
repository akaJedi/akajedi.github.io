name = "green-rice-1ea7"
main = "src/worker.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

preview_urls = false

[observability]
enabled = true

[vars]
ALLOWED_ORIGIN = "https://www.f12.biz,https://f12.biz,https://cloudflare.f12.biz,https://f12-biz.pages.dev,https://netlify.f12.biz,https://f12-biz.netlify.app,https://github.f12.biz"
OWNER_TIMEZONE = "America/Los_Angeles"
QUIET_HOURS_START = "23"
QUIET_HOURS_END = "6"
CLOSED_RETENTION_DAYS = "180"
SPAM_RETENTION_DAYS = "30"
# Deliberately off. When "false" (or unset), the scheduled retention cleanup
# only logs what it would delete (see src/retention.ts and ROADMAP.md item 1).
# Flip to "true" only after reviewing a stretch of those dry-run logs.
RETENTION_CLEANUP_ENABLED = "false"
ENVIRONMENT = "production"
SENTRY_SUCCESS_EVENT_SAMPLE_RATE = "0.10"
SENTRY_REJECTION_EVENT_SAMPLE_RATE = "1.0"
SENTRY_SLOW_REQUEST_MS = "3000"
SENTRY_TEST_ENABLED = "false"
TURNSTILE_REQUIRED = "true"
TURNSTILE_EXPECTED_HOSTNAMES = "www.f12.biz,f12.biz,cloudflare.f12.biz,f12-biz.pages.dev,netlify.f12.biz,f12-biz.netlify.app,github.f12.biz"
DNS_WATCH_TELEGRAM_DOMAINS = "f12.biz,zolotoy-telenok42.ru"

[[d1_databases]]
binding = "DB"
database_name = "website-chat"
database_id = "e3c18977-ec3f-42a9-8f36-7e6fa63fbf46"
migrations_dir = "migrations"

[triggers]
crons = ["*/5 * * * *", "2-59/5 * * * *"]
