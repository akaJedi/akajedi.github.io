baseURL = "https://www.f12.biz"
relativeURLs = true
canonifyURLs = true
enableRobotsTXT = true
title = "Denis Tolochko Personal website"
languageCode = "en"

[pagination]
pagerSize = 10


# Exclude footer section from generating list pages (index.html and index.xml)

[services]
  [services.disqus]
    shortname = 'your-disqus-shortname'
	
[outputs]
  page = ["HTML", "JSON"]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS", "JSON"]
  taxonomy = ["HTML", "RSS"]
  term = ["HTML", "RSS"]
  footer = []

# Explicitly prevent the footer section from generating any output
[outputFormats.footerSection]
  # Empty configuration to prevent any output

# Specifically disable generation of these kinds for the footer content
disableKinds = ["footerSection", "RSS"]

[module]
[[module.imports]]
path = "github.com/zetxek/adritian-free-hugo-theme"

## Base mounts - so your site's assets are available
[[module.mounts]]
source = "archetypes"
target = "archetypes"

[[module.mounts]]
source = "assets"
target = "assets"

[[module.mounts]]
source = "i18n"
target = "i18n"

[[module.mounts]]
source = "layouts"
target = "layouts"

[[module.mounts]]
source = "static"
target = "static"

# The following mounts are required for the theme to be able to load bootstrap
# Remember also to copy the theme's `package.json` to your site, and run `npm install`
[[module.mounts]]
source = "node_modules/bootstrap/scss"
target = "assets/scss/bootstrap"

[[module.mounts]]
source = "node_modules/bootstrap/dist/js"
target = "assets/js/bootstrap"

[[module.mounts]]
source = "node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"
target = "assets/js/vendor/bootstrap.bundle.min.js"

[[module.mounts]]
source = "node_modules/bootstrap-print-css/css/bootstrap-print.css"
target = "assets/css/bootstrap-print.css"


[params]
title = 'Denis Tolochko - IT Systems Operations Engineer'
description = 'IT Systems Operations Engineer specializing in infrastructure, cloud, and automation. Sharing projects, skills, and updates from over 15 years in tech across support, security, and DevOps.'
#images = ['/img/og-img.png']
sections = [
  "showcase",
  "about",
  "education",
  "experience",
  "client-and-work",
  "testimonial",
  "contact",
  "newsletter",
]
# If you want to display an image logo in the header, you can add it here
# logo = '/img/hugo.svg'

homepageExperienceCount = 6

[params.chat]
turnstileSiteKey = "0x4AAAAAAD4sOQrB_w1S3WdR"
# api.f12.biz is a Cloudflare Workers custom domain pointed at the same
# green-rice-1ea7 Worker as https://green-rice-1ea7.denis-f21.workers.dev —
# identical backend, just a friendlier hostname. Every template below falls
# back to this same value if this line is ever removed, so it stays the
# single source of truth in the normal case.
apibase = "https://api.f12.biz"

[params.analytics]
## Analytics parameters.
### Supported so far: Vercel (Page Insights, Analytics)
### And Google (Tag Manager, Analytics)

# controls vercel page insights - disabled by default
# to enable, just set to true
vercelPageInsights = false
vercelAnalytics = false

# google analytics and tag manager. to enable, set "enabled" to true
# and add the tracking code (UA-something for analytics, GTM-something for tag manager)
[params.analytics.googleAnalytics]
code = "G-LPLDLSPHQL"
enabled = true
[params.analytics.googleTagManager]
code = "GTM-5FDMPK6X"
enabled = true

# Cookiebot consent banner. cbid is the Cookiebot domain group ID, not a
# secret. Loaded as the first script in <head> so its data-blockingmode
# "auto" can actually intercept the analytics scripts that follow it.
[params.analytics.cookiebot]
cbid = "e8ac67ea-987a-4e64-8b8e-01d6f1643976"
enabled = true

[build]
writeStats = true

[build.buildStats]
enabledFor = ["scss"]
disableClasses = false
disableIDs = false
disableTags = false
enable = true

